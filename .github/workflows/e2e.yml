name: OpenSpec Validation

on:
  push:
    branches:
      - canary
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Validate active PDF builder OpenSpec change
        run: pnpm dlx @fission-ai/openspec@1.14.3 validate build-pdf-document-builder
      - name: Validate all OpenSpec changes
        run: pnpm dlx @fission-ai/openspec@1.14.3 validate --all
