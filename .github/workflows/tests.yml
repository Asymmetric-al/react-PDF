name: Tests

on:
  push:
    branches:
      - canary
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run baseline smoke
        run: pnpm asym:baseline-smoke
      - name: Build editor test dependencies
        run: |
          pnpm --filter @react-email/render build
          pnpm --filter react-email build
      - name: Run editor unit tests
        run: pnpm --filter @react-email/editor test:unit
      - name: Qualify all five Core PDF packages
        run: pnpm core-pdf:check
      - name: Verify reproducible Core PDF packages
        run: pnpm core-pdf:reproduce
      - name: Install pinned Chromium
        run: pnpm --filter @react-email/editor exec playwright install --with-deps chromium
      - name: Verify public PDF editor in Chromium
        run: pnpm core-pdf:browser
      - name: Verify retained PDF contracts in Chromium
        run: pnpm core-pdf:render
