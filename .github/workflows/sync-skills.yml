name: Skills Check

on:
  push:
    branches:
      - main
      - canary
    paths:
      - "skills/**"
      - ".github/workflows/sync-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/sync-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm local skills are repo-owned
        run: |
          echo "Skills are maintained in this fork."
          echo "No external upstream skills sync is configured for this repository."
